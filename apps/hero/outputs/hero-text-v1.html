<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hero Section</title>
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">

    .hero {
      @apply flex items-center justify-center w-full px-6 py-16 md:px-12 md:py-24;
    }

    .hero-content {
      @apply w-full max-w-4xl;
    }

    .hero h1 {
      @apply max-w-4xl text-4xl md:text-6xl font-bold leading-tight;
      overflow-wrap: anywhere;
    }

    .hero h2 {
      @apply max-w-3xl mt-6 text-lg md:text-2xl leading-relaxed;
      overflow-wrap: anywhere;
    }

    .hero-light {
      @apply bg-slate-50;
    }

    .hero-light h1 {
      @apply text-slate-900;
    }

    .hero-light h2 {
      @apply text-slate-700;
    }

    .hero-dark {
      @apply bg-slate-900;
    }

    .hero-dark h1 {
      @apply text-slate-50;
    }

    .hero-dark h2 {
      @apply text-slate-300;
    }

    .hero-centre .hero-content {
      @apply text-center mx-auto;
    }

    .hero-min-height {
      @apply min-h-[480px] md:min-h-[85vh];
    }

    .hero h2[hidden] {
      display: none !important;
    }
  
  </style>
</head>
<body>
  <header class="hero hero-dark hero-min-height">
    <div class="hero-content">
      <h1>HEEEEELP</h1>
      
          <h2>SOCORROOOOOOOOOOOOOOOOOOOOOOOOOOO</h2>
        
    </div>
  </header>
</body>
</html>
